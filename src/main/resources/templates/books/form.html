<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{bookForm.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container page-content narrow">
    <a class="back-link" th:href="@{/books}" th:text="|← #{common.backCatalogue}|">← Back to catalogue</a>
    <div class="page-heading"><div><p class="eyebrow" th:text="#{bookForm.eyebrow}">LIBRARIAN</p><h1 th:text="${book.id == null ? #messages.msg('bookForm.add') : #messages.msg('bookForm.edit')}">Book form</h1></div></div>
    <div class="alert danger" th:if="${formError}" th:text="${formError}"></div>
    <form class="panel stack-form" th:action="@{/books/save}" th:object="${book}" method="post">
        <input type="hidden" th:field="*{id}">
        <label for="title" th:text="#{bookForm.titleLabel}">Title</label><input id="title" type="text" th:field="*{title}" maxlength="180" required><p class="field-error" th:errors="*{title}"></p>
        <label for="isbn" th:text="#{bookForm.isbnLabel}">ISBN</label><input id="isbn" type="text" th:field="*{isbn}" maxlength="30" required><p class="field-error" th:errors="*{isbn}"></p>
        <label for="author" th:text="#{bookForm.authorLabel}">Author</label><input id="author" type="text" th:field="*{author}" maxlength="160" required><p class="field-error" th:errors="*{author}"></p>
        <label for="category" th:text="#{bookForm.categoryLabel}">Category</label><input id="category" type="text" th:field="*{category}" maxlength="100" required><p class="field-error" th:errors="*{category}"></p>
        <label for="description" th:text="#{bookForm.descriptionLabel}">Description</label><textarea id="description" th:field="*{description}" maxlength="1000" rows="5"></textarea><p class="field-error" th:errors="*{description}"></p>
        <div class="button-row"><button class="button primary" type="submit" th:text="#{bookForm.save}">Save book</button><a class="button quiet" th:href="@{/books}" th:text="#{common.cancel}">Cancel</a></div>
    </form>
</main>
</body>
</html>
