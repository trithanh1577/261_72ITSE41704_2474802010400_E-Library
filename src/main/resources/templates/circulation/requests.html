<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{requests.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container page-content">
    <div class="page-heading"><div><p class="eyebrow" th:text="#{bookForm.eyebrow}">LIBRARIAN</p><h1 th:text="#{requests.heading}">Borrowing requests</h1><p class="muted" th:text="#{requests.description}">Review pending requests. Approval creates a loan if a copy and member are eligible.</p></div></div>
    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <div class="alert danger" th:if="${error}" th:text="${error}"></div>
    <section class="panel" th:if="${!#lists.isEmpty(requests)}">
        <table class="data-table"><thead><tr><th th:text="#{requests.requested}">Requested</th><th th:text="#{common.member}">Member</th><th th:text="#{common.book}">Book</th><th th:text="#{requests.memberNote}">Member note</th><th th:text="#{common.status}">Status</th><th th:text="#{requests.decision}">Decision</th></tr></thead>
            <tbody><tr th:each="request : ${requests}">
                <td th:text="${#temporals.format(request.requestedAt, 'yyyy-MM-dd HH:mm')}">Date</td>
                <td th:text="${request.member.displayName}">Member</td>
                <td><a th:href="@{/books/{id}(id=${request.book.id})}" th:text="${request.book.title}">Book</a></td>
                <td th:text="${request.memberNote == null ? '—' : request.memberNote}">Note</td>
                <td th:text="${#messages.msg('status.' + request.status.name())}">PENDING</td>
                <td>
                    <div class="button-row" th:if="${request.status.name() == 'PENDING'}">
                        <form th:action="@{/circulation/requests/{id}/approve(id=${request.id})}" method="post"><button class="button primary" type="submit" th:text="#{requests.approve}">Approve</button></form>
                        <form th:action="@{/circulation/requests/{id}/reject(id=${request.id})}" method="post"><input type="hidden" name="reason" th:value="#{requests.rejectReason}"><button class="button danger-outline" type="submit" th:text="#{requests.reject}">Reject</button></form>
                    </div>
                    <span class="muted" th:if="${request.status.name() != 'PENDING'}" th:text="${request.decisionNote}"></span>
                </td>
            </tr></tbody>
        </table>
    </section>
    <div class="empty-state" th:if="${#lists.isEmpty(requests)}"><h2 th:text="#{requests.emptyTitle}">No requests yet</h2><p class="muted" th:text="#{requests.emptyText}">Member requests will appear here.</p></div>
</main>
</body>
</html>
