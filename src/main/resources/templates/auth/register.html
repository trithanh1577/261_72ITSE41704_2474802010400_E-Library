<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{auth.registerTitle})}"></head>
<body class="login-page">
<main class="login-card">
    <div class="auth-language"><div th:replace="~{fragments/layout :: language-switch}"></div></div>
    <div class="brand-mark" th:text="#{auth.registerTitle}">Create a member account</div>
    <p class="muted" th:text="#{auth.registerDescription}">Registration creates a library member account.</p>
    <form th:action="@{/register}" th:object="${registrationForm}" method="post" class="stack-form">
        <div class="alert danger" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
        <label for="displayName" th:text="#{auth.displayName}">Display name</label>
        <input id="displayName" th:field="*{displayName}" maxlength="120" autocomplete="name" required>
        <p class="field-error" th:errors="*{displayName}"></p>

        <label for="username" th:text="#{auth.username}">Username</label>
        <input id="username" th:field="*{username}" minlength="3" maxlength="80" autocomplete="username" required>
        <p class="field-error" th:errors="*{username}"></p>

        <label for="email" th:text="#{auth.email}">Email</label>
        <input id="email" th:field="*{email}" type="email" maxlength="254" autocomplete="email" required>
        <p class="field-error" th:errors="*{email}"></p>

        <label for="password" th:text="#{auth.password}">Password</label>
        <input id="password" th:field="*{password}" type="password" maxlength="72" autocomplete="new-password" required>
        <p class="field-error" th:errors="*{password}"></p>
        <p class="field-error" th:errors="*{passwordWithinBcryptLimit}"></p>

        <label for="confirmPassword" th:text="#{auth.confirmPassword}">Confirm password</label>
        <input id="confirmPassword" th:field="*{confirmPassword}" type="password" autocomplete="new-password" required>
        <p class="field-error" th:errors="*{confirmPassword}"></p>

        <button class="button primary full" type="submit" th:text="#{auth.createAccount}">Create account</button>
    </form>
    <p class="hint"><a th:href="@{/login}" th:text="#{auth.backToSignIn}">Back to sign in</a></p>
</main>
</body>
</html>
