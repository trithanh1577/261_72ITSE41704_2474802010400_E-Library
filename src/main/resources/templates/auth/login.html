<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body class="login-page">
<main class="login-card">
    <div class="brand-mark">E-Library</div>
    <p class="muted">Book catalogue and circulation foundation</p>
    <div class="alert success" th:if="${param.logout}">You have signed out.</div>
    <div class="alert danger" th:if="${param.error}">Invalid username or password.</div>
    <form th:action="@{/login}" method="post" class="stack-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="button primary full" type="submit">Sign in</button>
    </form>
    <p class="hint">Local demo: <code>admin / admin123</code> or <code>member / member123</code></p>
</main>
</body>
</html>
