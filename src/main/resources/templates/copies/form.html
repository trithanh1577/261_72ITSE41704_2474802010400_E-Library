<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{copyForm.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container page-content narrow">
    <a class="back-link" th:href="@{/books/{id}(id=${book.id})}" th:text="|← #{common.backBook}|">← Back to book</a>
    <div class="page-heading"><div><p class="eyebrow" th:text="#{copyForm.eyebrow}">LIBRARIAN / PHYSICAL COPY</p><h1 th:text="${copy == null ? #messages.msg('copyForm.add') : #messages.msg('copyForm.edit')}">Copy form</h1><p class="muted" th:text="${book.title}">Book</p></div></div>
    <div class="alert danger" th:if="${formError}" th:text="${formError}"></div>
    <form class="panel stack-form" th:object="${copyForm}" method="post" th:action="${formAction}">
        <label for="copyCode" th:text="#{copyForm.code}">Copy code</label><input id="copyCode" type="text" th:field="*{copyCode}" maxlength="50" th:placeholder="#{copyForm.codePlaceholder}" required><p class="field-error" th:errors="*{copyCode}"></p>
        <div th:if="${copy != null and (copy.status.name() == 'ON_LOAN' or copy.status.name() == 'RESERVED')}">
            <label for="status" th:text="#{copyForm.status}">Status</label><input id="status" type="hidden" th:field="*{status}">
            <p class="muted" th:text="${copy.status.name() == 'ON_LOAN' ? #messages.msg('copyForm.onLoan') : #messages.msg('copyForm.reserved')}">Workflow-managed copy status</p>
        </div>
        <div th:unless="${copy != null and (copy.status.name() == 'ON_LOAN' or copy.status.name() == 'RESERVED')}">
            <label for="status" th:text="#{copyForm.status}">Status</label><select id="status" th:field="*{status}"><option value="AVAILABLE" th:text="#{status.AVAILABLE}">AVAILABLE</option><option value="MAINTENANCE" th:text="#{status.MAINTENANCE}">MAINTENANCE</option></select><p class="field-error" th:errors="*{status}"></p>
        </div>
        <div class="button-row"><button class="button primary" type="submit" th:text="#{copyForm.save}">Save copy</button><a class="button quiet" th:href="@{/books/{id}(id=${book.id})}" th:text="#{common.cancel}">Cancel</a></div>
    </form>
</main>
</body>
</html>
